<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="NEON TAP — браузерная ритм-игра с автогенерацией карт из любого MP3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NEON TAP" />
    <meta name="application-name" content="NEON TAP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2305060a'/%3E%3Crect x='8' y='14' width='10' height='36' rx='3' fill='%2300f0ff'/%3E%3Crect x='22' y='14' width='10' height='36' rx='3' fill='%23ff2bd6'/%3E%3Crect x='36' y='14' width='10' height='36' rx='3' fill='%23b6ff00'/%3E%3Crect x='50' y='14' width='10' height='36' rx='3' fill='%23ff8a00'/%3E%3C/svg%3E" />
    <!-- The UI font lives with the game (src/app/styles/global.css): its two first-screen subsets start downloading with the page. -->
    <link rel="preload" href="/src/app/fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/app/fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <title>NEON TAP</title>
    <!--
      Critical CSS: the page is dark from the very first paint (no white flash while the bundle
      loads — matters most for the installed app, whose splash is background_color + icon), and a
      logo splash with a loading bar sits on top until the boot assets are in (src/app/main.tsx, src/app/boot.ts).
    -->
    <style>
      html {
        background: #05060a;
        color-scheme: dark;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Sizing (the visible viewport, --app-h) lives in src/app/styles/global.css: nothing is in #root before it loads. */
      body {
        margin: 0;
        background: #05060a;
        color: #fff;
        overflow: hidden;
      }
      /* The loading screen: the key art (Юно и Яма on stage) in a phone-wide column, its bottom fading
         into the page; the logo (on black) screen-blended on the stage floor, the tagline, the bar. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 20000;
        background: #05060a;
        transition: opacity 0.35s ease;
        pointer-events: none;
        overflow: hidden;
      }
      #splash.splash-out {
        opacity: 0;
      }
      .splash-stage {
        position: relative;
        width: min(100vw, 520px);
        height: 100%;
        margin: 0 auto;
      }
      .splash-art {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
        mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
      }
      .splash-foot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .splash-logo {
        width: 86%;
        max-width: 440px;
        height: auto;
        mix-blend-mode: screen;
      }
      .splash-tagline {
        font-family: 'Unbounded', 'Segoe UI', system-ui, sans-serif;
        font-weight: 700;
        font-size: 15px;
        line-height: 20px;
        letter-spacing: 0.02em;
        color: rgba(235, 236, 245, 0.9);
        text-align: center;
      }
      /* The loading bar: `--p` (0..1) is set by src/app/main.tsx as the boot assets arrive. */
      .splash-bar {
        width: 160px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .splash-bar i {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 2px;
        background: #fff;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        transform-origin: left center;
        transform: scaleX(max(0.04, var(--p, 0)));
        transition: transform 0.25s ease;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="splash-stage">
        <img class="splash-art" src="/src/app/splash/key-art.webp" alt="" width="1170" height="1755" fetchpriority="high" />
        <div class="splash-foot">
          <img class="splash-logo" src="/src/app/splash/logo.webp" alt="Neon Tap" width="1000" height="500" />
          <div class="splash-tagline" id="splash-tagline">ритм-плитки под свою музыку</div>
          <div class="splash-bar" id="splash-bar"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
